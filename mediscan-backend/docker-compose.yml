# ============================================
# MediScan AI Backend - Docker Compose
# Brings up the Spring Boot API together with MongoDB.
# ============================================

services:
  mongodb:
    image: mongo:7
    container_name: mediscan-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-mediscan}
    volumes:
      - mediscan-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediscan-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DATABASE:-mediscan}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL:-https://api.anthropic.com/v1/messages}
      AI_API_MODEL: ${AI_API_MODEL:-claude-sonnet-4-6}
      AI_API_TIMEOUT_MS: ${AI_API_TIMEOUT_MS:-30000}
      TESSERACT_PATH: ${TESSERACT_PATH:-/usr/share/tesseract-ocr/5/tessdata}
      TESSERACT_LANGUAGE: ${TESSERACT_LANGUAGE:-eng}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-12MB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - mediscan-uploads:/app/uploads

volumes:
  mediscan-mongo-data:
  mediscan-uploads:
