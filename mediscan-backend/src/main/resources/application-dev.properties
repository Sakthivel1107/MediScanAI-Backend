# ============================================
# MediScan AI Backend - Development Profile
# ============================================

# Verbose logging in dev
logging.level.com.mediscan.backend=DEBUG
logging.level.org.springframework.web=DEBUG

# Swagger UI enabled in dev (also enabled by default; explicit here for clarity)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Fail fast on missing Mongo connection during development
spring.data.mongodb.uri=${DB_URI}
