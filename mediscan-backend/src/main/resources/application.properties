# ============================================
# MediScan AI Backend - Base Configuration
# All sensitive values are sourced from environment variables (.env / OS env).
# See .env.example for the full list of required variables.
# ============================================

spring.application.name=mediscan-backend

# Active profile (dev by default; override with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Server ----------
server.address=0.0.0.0
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---------- MongoDB ----------
spring.mongodb.uri=${DB_URI}
spring.data.mongodb.auto-index-creation=true

# ---------- JWT ----------
jwt.secret=${SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# ---------- AI / LLM Service ----------
ai.api.key=${API_KEY}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent}
ai.api.model=${AI_API_MODEL:gemini-3.1-flash-lite}
ai.api.timeout-ms=${AI_API_TIMEOUT_MS:30000}

# ---------- OCR (Tesseract) ----------
# TESSERACT_PATH must point to the parent directory of tessdata.
tesseract.path=${TESSERACT_PATH:/usr/share/tesseract-ocr/4.00}
tesseract.language=${TESSERACT_LANGUAGE:eng}

# ---------- File Upload ----------
file.upload-dir=${UPLOAD_DIR:/tmp/mediscan-uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

# ---------- CORS ----------
# Comma-separated list of allowed origins, e.g. http://192.168.1.100:xxxx
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.mediscan.backend=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n

# ---------- Springdoc / Swagger ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
